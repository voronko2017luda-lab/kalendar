<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Православный рождественский календарь.">
  <title>Дорога к рождеству Христову</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FCFBF7;            /* Теплый светлый фон (слоновая кость) */
      --surface: #FFFFFF;       /* Белый для карточек */
      --accent-red: #8B2626;    /* Благородный рождественский красный */
      --accent-gold: #C49A45;   /* Теплое золото */
      --text-main: #1A1A1A;     /* Почти черный для текста */
      --text-muted: #666666;    /* Серый для описаний */
      --border: rgba(139, 38, 38, 0.15); /* Легкая рамка */
      
      --font-display: 'Syne', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --ease-out: cubic-bezier(0.19, 1, 0.22, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      cursor: none;
    }

    /* Кастомный курсор адаптирован под светлый фон */
    .cursor {
      position: fixed; top: 0; left: 0;
      width: 10px; height: 10px;
      background: var(--accent-red);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s, background 0.3s;
    }
    .cursor-outline {
      position: fixed; top: 0; left: 0;
      width: 36px; height: 36px;
      border: 1px solid rgba(139, 38, 38, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.2s;
      transition-timing-function: var(--ease-out);
    }

    body {
      font-family: var(--font-display);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; cursor: none; }
    button { cursor: none; font-family: inherit; }
    
    /* Шапка */
    .header {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 1rem 4vw;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
      background: rgba(252, 251, 247, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: var(--font-serif);
      font-size: 1.2rem; font-weight: 600; letter-spacing: 0.05em;
      color: var(--accent-red);
      text-transform: uppercase;
    }
    .nav { display: flex; gap: 2rem; }
    .nav a {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-main); position: relative; overflow: hidden;
    }
    .nav a span { display: block; transition: transform 0.4s var(--ease-out); }
    .nav a:hover span { transform: translateY(-100%); }
    .nav a::after {
      content: attr(data-text); position: absolute; top: 100%; left: 0;
      color: var(--accent-red); transition: transform 0.4s var(--ease-out);
    }
    .nav a:hover::after { transform: translateY(-100%); }
    
    .btn-menu { display: none; background: none; border: none; color: var(--text-main); }

    /* Hero Section - Компактный и легкий */
    .hero {
      display: flex; flex-direction: column; justify-content: center;
      padding: 100px 4vw 2rem; /* Уменьшен отступ */
      position: relative;
    }
    
    /* Легкая фоновая текстура */
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(196, 154, 69, 0.08) 0%, transparent 50%),
        linear-gradient(var(--border) 1px, transparent 1px), 
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      opacity: 0.5;
      z-index: -1;
      mask-image: linear-gradient(to bottom, black, transparent);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent);
    }

    .hero-content {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      flex-wrap: wrap; gap: 1rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 5vw, 4rem); /* Значительно уменьшен */
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
    .hero-title em { font-style: italic; color: var(--accent-red); }

    .hero-meta {
      display: flex; gap: 2rem;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted); font-weight: 600;
    }
    .hero-meta span { display: flex; align-items: center; gap: 0.5rem; }
    .hero-meta span::before { content: '✦'; color: var(--accent-gold); font-size: 0.9rem; }

    /* Секции контента */
    .content-section { 
      padding: 2rem 4vw; 
      position: relative; 
    }
    
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .section-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Кнопка обновления */
    .refresh-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.6rem 1.2rem;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 0.5rem;
      transition: all 0.3s; border-radius: 30px;
    }
    .refresh-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
    .refresh-btn.is-loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* --- Карточки разделов --- */
    .sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .section-card {
      display: flex; flex-direction: column;
      padding: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
      min-height: 220px;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
    }

    .section-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(139, 38, 38, 0.08);
      border-color: var(--accent-gold);
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    
    .card-date {
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent-red); font-weight: 600;
    }
    
    .card-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 50%;
      color: var(--accent-gold);
      transition: all 0.3s var(--ease-out);
    }
    .section-card:hover .card-icon { 
      background: var(--accent-red); border-color: var(--accent-red); color: white;
    }

    .card-content { margin-top: 1.5rem; }
    
    .card-title {
      font-family: var(--font-serif);
      font-size: 1.5rem; line-height: 1.2; font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }
    
    .card-text {
      font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; font-weight: 400;
    }

    /* --- Галерея --- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .gallery-card {
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      aspect-ratio: 4/3; /* Фиксированные пропорции для компактности */
    }

    .gallery-img-wrapper {
      width: 100%; height: 100%;
      overflow: hidden; position: relative;
      background: #eee;
    }
    
    .gallery-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s var(--ease-out);
    }
    .gallery-card:hover .gallery-img { transform: scale(1.05); }

    .gallery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(139, 38, 38, 0.85) 0%, rgba(139, 38, 38, 0) 70%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 1.5rem;
      transform: translateY(10px); opacity: 0;
      transition: transform 0.4s var(--ease-out), opacity 0.4s;
    }
    .gallery-card:hover .gallery-overlay { transform: translateY(0); opacity: 1; }

    .gallery-title {
      font-family: var(--font-serif);
      font-size: 1.3rem; line-height: 1.1; margin-bottom: 0.2rem;
      color: white;
    }
    .gallery-text { font-size: 0.75rem; color: rgba(255,255,255,0.8); }
    
    .gallery-arrow {
      position: absolute; top: 1rem; right: 1rem;
      width: 30px; height: 30px; border-radius: 50%;
      background: white; color: var(--accent-red);
      display: flex; align-items: center; justify-content: center;
      transform: scale(0); transition: transform 0.3s var(--ease-out);
    }
    .gallery-card:hover .gallery-arrow { transform: scale(1); }

    /* Статусы */
    .sections-status {
      grid-column: 1 / -1; padding: 2rem; text-align: center;
      font-size: 0.9rem; color: var(--text-muted);
      background: var(--surface); border: 1px dashed var(--border); border-radius: 8px;
    }

    /* --- Подвал --- */
    .footer {
      padding: 2rem 4vw; display: flex; justify-content: space-between;
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }

    /* --- Адаптив --- */
    @media (max-width: 768px) {
      html, body, a, button { cursor: auto; }
      .cursor, .cursor-outline { display: none; }
      
      .nav { display: none; }
      .btn-menu { display: block; }
      
      .hero-content { flex-direction: column; align-items: flex-start; }
      .hero-meta { flex-direction: column; gap: 0.5rem; }
      
      .sections-grid, .gallery-grid { grid-template-columns: 1fr; }
      .section-card { min-height: auto; }
      
      .gallery-overlay { opacity: 1; transform: translateY(0); background: linear-gradient(to top, rgba(139,38,38,0.9), transparent); }
      .gallery-arrow { display: none; }
    }
  </style>
</head>
<body>

  <div class="cursor"></div>
  <div class="cursor-outline"></div>

  <header class="header">
    <a href="index.html" class="logo">Дорога к рождеству Христову</a>
    <nav class="nav">
      <a href="calendar.html" data-text="Календарь"><span>Календарь</span></a>
      <a href="tradition.html" data-text="О традиции"><span>О традиции</span></a>
      <a href="tasks.html" data-text="Задания"><span>Задания</span></a>
      <a href="recipes.html" data-text="Рецепты"><span>Рецепты</span></a>
      <a href="#sections" data-text="Разделы"><span>Разделы</span></a>
      <a href="#gallery" data-text="Галерея"><span>Галерея</span></a>
    </nav>
    <button class="btn-menu">МЕНЮ</button>
  </header>

  <main>
    <!-- Компактный Hero -->
    <section class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Свет <em>тихой</em> радости</h1>
        <div class="hero-meta">
          <span>40 дней ожидания</span>
          <span>28 ноября — 6 января</span>
          <span>Православная традиция</span>
        </div>
      </div>
    </section>

    <!-- Секция Разделы -->
    <section class="content-section" id="sections">
      <div class="section-header">
        <h2 class="section-title">Разделы</h2>
        <button class="refresh-btn" id="refresh-sections-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.5L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="refresh-label">Обновить</span>
        </button>
      </div>
      <div class="sections-grid" id="sections-grid">
        <p class="sections-status">Загрузка данных…</p>
      </div>
    </section>

    <!-- Секция Галерея -->
    <section class="content-section" id="gallery">
      <div class="section-header">
        <h2 class="section-title">Галерея</h2>
        <button class="refresh-btn" id="refresh-gallery-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.5L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="refresh-label">Обновить</span>
        </button>
      </div>
      <div class="gallery-grid" id="gallery-grid">
        <p class="sections-status">Загрузка образов…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Рождественский календарь</span>
    <span>&copy; <span id="year"></span> / Новый стиль</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Кастомный курсор
    const cursor = document.querySelector('.cursor');
    const cursorOutline = document.querySelector('.cursor-outline');
    
    if (window.matchMedia("(pointer: fine)").matches) {
      let mouseX = 0, mouseY = 0;
      let outlineX = 0, outlineY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      });

      function animateOutline() {
        outlineX += (mouseX - outlineX) * 0.15;
        outlineY += (mouseY - outlineY) * 0.15;
        cursorOutline.style.transform = `translate(${outlineX}px, ${outlineY}px) translate(-50%, -50%)`;
        requestAnimationFrame(animateOutline);
      }
      animateOutline();

      const hoverElements = document.querySelectorAll('a, button, .section-card, .gallery-card');
      hoverElements.forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursor.style.width = '30px'; cursor.style.height = '30px';
          cursorOutline.style.width = '50px'; cursorOutline.style.height = '50px';
          cursorOutline.style.borderColor = 'rgba(139, 38, 38, 0.6)';
        });
        el.addEventListener('mouseleave', () => {
          cursor.style.width = '10px'; cursor.style.height = '10px';
          cursorOutline.style.width = '36px'; cursorOutline.style.height = '36px';
          cursorOutline.style.borderColor = 'rgba(139, 38, 38, 0.4)';
        });
      });
    }

    (function () {
      /* ================= ЛОГИКА ЗАГРУЗКИ ДАННЫХ ================= */
      const PROXIES = [
        'https://api.allorigins.win/raw?url=',
        'https://api.codetabs.com/v1/proxy?quest='
      ];

      function parseCSV(text) {
        const rows = []; let row = []; let field = ''; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const char = text[i]; const next = text[i + 1];
          if (inQuotes) {
            if (char === '"' && next === '"') { field += '"'; i++; }
            else if (char === '"') { inQuotes = false; }
            else { field += char; }
          } else {
            if (char === '"') { inQuotes = true; }
            else if (char === ',') { row.push(field); field = ''; }
            else if (char === '\n' || char === '\r') {
              if (char === '\r' && next === '\n') i++;
              row.push(field);
              if (row.some(cell => cell.trim() !== '')) rows.push(row);
              row = []; field = '';
            } else { field += char; }
          }
        }
        if (field !== '' || row.length > 0) {
          row.push(field);
          if (row.some(cell => cell.trim() !== '')) rows.push(row);
        }
        return rows;
      }

      function isActive(cell) {
        const normalized = String(cell).trim().toLowerCase();
        return normalized === 'true' || normalized === '1' || normalized === 'да' || normalized === 'on';
      }

      async function fetchWithProxy(url) {
        try {
          const directRes = await fetch(url, { cache: 'no-store' });
          if (directRes.ok) return await directRes.text();
        } catch (e) { /* CORS */ }
        let lastError = null;
        for (const proxy of PROXIES) {
          try {
            const response = await fetch(proxy + encodeURIComponent(url), { cache: 'no-store' });
            if (response.ok) {
              const text = await response.text();
              if (text.trim().toLowerCase().startsWith('<!doctype html') || text.trim().toLowerCase().startsWith('<html')) {
                throw new Error('Proxy error');
              }
              return text;
            }
            lastError = new Error(`HTTP ${response.status}`);
          } catch (e) { lastError = e; }
        }
        throw lastError || new Error('Load failed');
      }

      function setupButton(btn) {
        const label = btn.querySelector('.refresh-label');
        return {
          loading: () => { btn.classList.add('is-loading'); btn.disabled = true; label.textContent = '...'; },
          finish: (ok) => {
            btn.classList.remove('is-loading'); label.textContent = ok ? 'OK' : 'Err';
            setTimeout(() => { btn.disabled = false; label.textContent = 'Обновить'; }, 2000);
          }
        };
      }

      /* 1. РАЗДЕЛЫ */
      const SECTIONS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZ8ScGrpg72Ujy286RowU9xbEi8kE-BJ7jKaGAbpRBQ1JDWGzDSoOY2oC717pRF-a6vlivxqdvTvmk/pub?gid=0&single=true&output=csv';
      const sGrid = document.getElementById('sections-grid');
      const sBtn = document.getElementById('refresh-sections-btn');
      const sControl = setupButton(sBtn);

      const SVG_ARROW = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

      async function loadSections(init) {
        if (init) sControl.loading(); else sGrid.innerHTML = '<p class="sections-status">Загрузка…</p>';
        let ok = false;
        try {
          const res = await fetchWithProxy(SECTIONS_URL + '&_=' + Date.now());
          const rows = parseCSV(res);
          const h = rows[0].map(c => c.trim().toLowerCase().replace(/\s+/g, ''));
          const idx = { o: h.indexOf('порядок'), d: h.indexOf('дата'), t: h.indexOf('заголовок'), x: h.indexOf('текст'), l: h.indexOf('ссылка'), a: h.indexOf('активность') };
          
          if (Object.values(idx).includes(-1)) throw new Error('Columns missing');

          const items = rows.slice(1).map(r => ({
            o: parseInt(r[idx.o], 10), d: r[idx.d]?.trim() || '', t: r[idx.t]?.trim() || '', 
            x: r[idx.x]?.trim() || '', l: r[idx.l]?.trim() || '', a: isActive(r[idx.a])
          })).filter(i => i.a && i.t && !isNaN(i.o)).sort((a,b) => a.o - b.o);

          sGrid.innerHTML = '';
          items.forEach(item => {
            const el = document.createElement(item.l ? 'a' : 'div');
            el.className = 'section-card';
            if (item.l) { el.href = item.l; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
            
            el.innerHTML = `
              <div class="card-top">
                <span class="card-date">${item.d}</span>
                <div class="card-icon">${item.l ? SVG_ARROW : '·'}</div>
              </div>
              <div class="card-content">
                <h3 class="card-title">${item.t}</h3>
                <p class="card-text">${item.x}</p>
              </div>
            `;
            sGrid.appendChild(el);
          });
          ok = true;
        } catch (e) {
          sGrid.innerHTML = `<p class="sections-status">Ошибка: ${e.message}</p>`;
        }
        if (init) sControl.finish(ok);
      }
      sBtn.addEventListener('click', () => loadSections(true));
      loadSections(false);

      /* 2. ГАЛЕРЕЯ */
      const GALLERY_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmxQh-ENRcryK8b-QygpiSDkqGxWZizs5GVB6J2wmB15Q5fBNZfUm1BU1fnPcKemugZ2arT3hx9Dqn/pub?gid=0&single=true&output=csv';
      const gGrid = document.getElementById('gallery-grid');
      const gBtn = document.getElementById('refresh-gallery-btn');
      const gControl = setupButton(gBtn);

      async function loadGallery(init) {
        if (init) gControl.loading(); else gGrid.innerHTML = '<p class="sections-status">Загрузка…</p>';
        let ok = false;
        try {
          const res = await fetchWithProxy(GALLERY_URL + '&_=' + Date.now());
          const rows = parseCSV(res);
          const h = rows[0].map(c => c.trim().toLowerCase().replace(/\s+/g, ''));
          const idx = { o: h.indexOf('порядок'), t: h.indexOf('заголовок'), x: h.indexOf('текст'), i: h.indexOf('ссылкакартинка'), l: h.indexOf('ссылка'), a: h.indexOf('активность') };
          
          if (idx.o === -1 || idx.i === -1 || idx.a === -1) throw new Error('Columns missing');

          const items = rows.slice(1).map(r => ({
            o: parseInt(r[idx.o], 10), t: r[idx.t]?.trim() || '', x: r[idx.x]?.trim() || '', 
            i: r[idx.i]?.trim() || '', l: r[idx.l]?.trim() || '', a: isActive(r[idx.a])
          })).filter(i => i.a && i.i && !isNaN(i.o)).sort((a,b) => a.o - b.o);

          gGrid.innerHTML = '';
          items.forEach(item => {
            const el = document.createElement(item.l ? 'a' : 'div');
            el.className = 'gallery-card';
            if (item.l) { el.href = item.l; el.target = '_blank'; el.rel = 'noopener noreferrer'; }

            el.innerHTML = `
              <div class="gallery-img-wrapper">
                <img class="gallery-img" src="${item.i}" alt="${item.t}" loading="lazy">
              </div>
              <div class="gallery-overlay">
                <h3 class="gallery-title">${item.t}</h3>
                <p class="gallery-text">${item.x}</p>
              </div>
              ${item.l ? `<div class="gallery-arrow">${SVG_ARROW}</div>` : ''}
            `;
            gGrid.appendChild(el);
          });
          ok = true;
        } catch (e) {
          gGrid.innerHTML = `<p class="sections-status">Ошибка: ${e.message}</p>`;
        }
        if (init) gControl.finish(ok);
      }
      gBtn.addEventListener('click', () => loadGallery(true));
      loadGallery(false);
    })();
  </script>
</body>
</html>
