<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Православный рождественский календарь: 24 дня от 14 декабря до сочельника.">
  <title>Рождественский календарь — от поста до Крещения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: #0f0f0f;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --text-main: #F5F5F5;
      --text-muted: #888;
      --border: rgba(212, 175, 55, 0.2);
      --font-display: 'Syne', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --ease-expo: cubic-bezier(0.19, 1, 0.22, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      cursor: none; /* Кастомный курсор */
    }

    /* Кастомный курсор */
    .cursor {
      position: fixed; top: 0; left: 0;
      width: 12px; height: 12px;
      background: var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s, background 0.3s;
      mix-blend-mode: difference;
    }
    .cursor-outline {
      position: fixed; top: 0; left: 0;
      width: 40px; height: 40px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.2s;
      transition-timing-function: var(--ease-expo);
    }

    body {
      font-family: var(--font-display);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; cursor: none; }
    button { cursor: none; }
    
    /* Шапка */
    .header {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 2rem 4vw;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
    }
    .logo {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.05em;
      color: var(--text-main);
    }
    .nav {
      display: flex; gap: 3rem;
    }
    .nav a {
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-main); position: relative; overflow: hidden;
    }
    .nav a span { display: block; transition: transform 0.4s var(--ease-expo); }
    .nav a:hover span { transform: translateY(-100%); }
    .nav a::after {
      content: attr(data-text); position: absolute; top: 100%; left: 0;
      color: var(--gold); transition: transform 0.4s var(--ease-expo);
    }
    .nav a:hover::after { transform: translateY(-100%); }
    
    .btn-menu { display: none; background: none; border: none; color: white; }

    /* Hero Section - Революционная типографика */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 4vw;
      position: relative;
      overflow: hidden;
    }
    
    /* Фоновая сетка */
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 10vw 10vw;
      background-position: center;
      opacity: 0.3;
      z-index: -1;
      transform: perspective(500px) rotateX(20deg) scale(1.5);
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 15vw, 20rem);
      line-height: 0.8;
      font-weight: 300;
      letter-spacing: -0.04em;
      text-align: center;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    .hero-title .line-1 { transform: translateX(-5vw); }
    .hero-title .line-2 { 
      transform: translateX(5vw); 
      font-style: italic; 
      color: var(--gold);
    }

    .hero-meta {
      display: flex; justify-content: space-between;
      width: 100%; max-width: 800px; margin: 4rem auto 0;
      font-family: var(--font-display); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
      border-top: 1px solid var(--border); padding-top: 1.5rem;
    }

    /* Секции контента */
    .content-section { padding: 8rem 4vw; position: relative; border-bottom: 1px solid var(--border); }
    
    .section-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 4rem;
      border-bottom: 2px solid var(--text-main);
      padding-bottom: 1rem;
    }
    
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 400; line-height: 1;
      letter-spacing: -0.02em;
    }

    /* Кнопка обновления */
    .refresh-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-main); padding: 1rem 2rem;
      font-family: var(--font-display); font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 1rem;
      transition: all 0.3s;
      overflow: hidden; position: relative;
    }
    .refresh-btn::before {
      content: ''; position: absolute; inset: 0;
      background: var(--gold); transform: translateY(100%);
      transition: transform 0.4s var(--ease-expo); z-index: 0;
    }
    .refresh-btn:hover::before { transform: translateY(0); }
    .refresh-btn:hover { color: var(--bg); border-color: var(--gold); }
    .refresh-btn > * { position: relative; z-index: 1; }
    .refresh-btn.is-loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* --- Карточки разделов (Брутальный дизайн) --- */
    .sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 0; /* Убираем отступы для эффекта монолитной сетки */
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
    }

    .section-card {
      display: flex; flex-direction: column;
      padding: 3rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: background 0.4s;
      background: var(--bg);
      min-height: 400px;
      justify-content: space-between;
    }

    .section-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.1), transparent 70%);
      opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    .section-card:hover::after { opacity: 1; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    
    .card-date {
      font-family: var(--font-display);
      font-size: 0.9rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--gold);
    }
    
    .card-icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 50%;
      transition: transform 0.4s var(--ease-expo), background 0.4s, border-color 0.4s;
    }
    .section-card:hover .card-icon { 
      transform: rotate(45deg) scale(1.1); 
      background: var(--gold); border-color: var(--gold); color: var(--bg); 
    }

    .card-content { margin-top: 3rem; }
    
    .card-title {
      font-family: var(--font-serif);
      font-size: 2.5rem; line-height: 1.1; font-weight: 400;
      margin-bottom: 1rem;
      transition: color 0.3s;
    }
    .section-card:hover .card-title { color: var(--gold-light); }
    
    .card-text {
      font-family: var(--font-display);
      font-size: 1rem; color: var(--text-muted); line-height: 1.6; font-weight: 400;
    }

    /* --- Галерея (Асимметричная) --- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2rem;
    }

    .gallery-card {
      grid-column: span 6; /* По умолчанию половина */
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      background: var(--surface);
    }
    
    /* Создаем асимметрию для разных карточек, если их много */
    .gallery-card:nth-child(3n+1) { grid-column: span 8; }
    .gallery-card:nth-child(3n+2) { grid-column: span 4; }
    .gallery-card:nth-child(3n+3) { grid-column: span 5; }
    .gallery-card:nth-child(3n+4) { grid-column: span 7; }

    .gallery-img-wrapper {
      width: 100%; height: 100%; min-height: 400px;
      overflow: hidden; position: relative;
      filter: grayscale(100%) contrast(1.2);
      transition: filter 0.6s var(--ease-expo);
    }
    
    .gallery-card:hover .gallery-img-wrapper { filter: grayscale(0%) contrast(1); }
    
    .gallery-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s var(--ease-expo);
    }
    .gallery-card:hover .gallery-img { transform: scale(1.05); }

    .gallery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 3rem;
      transform: translateY(20px); opacity: 0;
      transition: transform 0.5s var(--ease-expo), opacity 0.5s;
    }
    .gallery-card:hover .gallery-overlay { transform: translateY(0); opacity: 1; }

    .gallery-title {
      font-family: var(--font-serif);
      font-size: 2.5rem; line-height: 1.1; margin-bottom: 0.5rem;
      color: var(--gold-light);
    }
    .gallery-text { font-family: var(--font-display); font-size: 0.95rem; color: #ccc; max-width: 80%; }
    
    .gallery-arrow {
      position: absolute; bottom: 3rem; right: 3rem;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--gold); color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      transform: scale(0); transition: transform 0.4s var(--ease-expo);
    }
    .gallery-card:hover .gallery-arrow { transform: scale(1); }

    /* Статусы */
    .sections-status {
      grid-column: 1 / -1; padding: 4rem; text-align: center;
      font-family: var(--font-display); font-size: 1.2rem; color: var(--text-muted);
      border: 1px dashed var(--border);
    }

    /* --- Подвал --- */
    .footer {
      padding: 4rem 4vw; display: flex; justify-content: space-between;
      font-family: var(--font-display); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    /* --- Адаптив --- */
    @media (max-width: 1024px) {
      .gallery-card { grid-column: span 12 !important; min-height: 300px; }
      .gallery-img-wrapper { min-height: 300px; }
      .gallery-overlay { opacity: 1; transform: translateY(0); background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
      .gallery-arrow { display: none; }
    }

    @media (max-width: 768px) {
      html, body, a, button { cursor: auto; } /* Отключаем кастомный курсор на мобильных */
      .cursor, .cursor-outline { display: none; }
      
      .nav { display: none; }
      .btn-menu { display: block; }
      
      .sections-grid { grid-template-columns: 1fr; }
      .section-card { padding: 2rem; min-height: 300px; }
      
      .hero-title { font-size: 4rem; }
      .hero-meta { flex-direction: column; gap: 1rem; }
      
      .section-header { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
      .section-title { font-size: 3.5rem; }
      
      .gallery-overlay { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="cursor"></div>
  <div class="cursor-outline"></div>

  <header class="header">
    <a href="index.html" class="logo">РК.</a>
    <nav class="nav">
      <a href="calendar.html" data-text="Календарь"><span>Календарь</span></a>
      <a href="tradition.html" data-text="О традиции"><span>О традиции</span></a>
      <a href="tasks.html" data-text="Задания"><span>Задания</span></a>
      <a href="recipes.html" data-text="Рецепты"><span>Рецепты</span></a>
      <a href="#sections" data-text="Разделы"><span>Разделы</span></a>
      <a href="#gallery" data-text="Галерея"><span>Галерея</span></a>
    </nav>
    <button class="btn-menu">МЕНЮ</button>
  </header>

  <main>
    <!-- Hero: Типографическая инсталляция -->
    <section class="hero">
      <h1 class="hero-title">
        <span class="line-1">Рождествен-</span>
        <span class="line-2">ский</span>
      </h1>
      <div class="hero-meta">
        <span>24 дня ожидания</span>
        <span>14 декабря — 6 января</span>
        <span>Новый стиль</span>
      </div>
    </section>

    <!-- Секция Разделы: Монолитная сетка -->
    <section class="content-section" id="sections">
      <div class="section-header">
        <h2 class="section-title">Разделы</h2>
        <button class="refresh-btn" id="refresh-sections-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.5L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="refresh-label">Обновить</span>
        </button>
      </div>
      <div class="sections-grid" id="sections-grid">
        <p class="sections-status">Загрузка данных…</p>
      </div>
    </section>

    <!-- Секция Галерея: Асимметричные образы -->
    <section class="content-section" id="gallery">
      <div class="section-header">
        <h2 class="section-title">Галерея</h2>
        <button class="refresh-btn" id="refresh-gallery-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.5L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="refresh-label">Обновить</span>
        </button>
      </div>
      <div class="gallery-grid" id="gallery-grid">
        <p class="sections-status">Загрузка образов…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Рождественский календарь</span>
    <span>&copy; <span id="year"></span> / Православная традиция</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Кастомный курсор
    const cursor = document.querySelector('.cursor');
    const cursorOutline = document.querySelector('.cursor-outline');
    
    if (window.matchMedia("(pointer: fine)").matches) {
      let mouseX = 0, mouseY = 0;
      let outlineX = 0, outlineY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      });

      function animateOutline() {
        outlineX += (mouseX - outlineX) * 0.15;
        outlineY += (mouseY - outlineY) * 0.15;
        cursorOutline.style.transform = `translate(${outlineX}px, ${outlineY}px) translate(-50%, -50%)`;
        requestAnimationFrame(animateOutline);
      }
      animateOutline();

      // Эффект при наведении на интерактивные элементы
      const hoverElements = document.querySelectorAll('a, button, .section-card, .gallery-card');
      hoverElements.forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursor.style.width = '40px'; cursor.style.height = '40px';
          cursorOutline.style.width = '60px'; cursorOutline.style.height = '60px';
          cursorOutline.style.borderColor = 'rgba(212, 175, 55, 0.8)';
        });
        el.addEventListener('mouseleave', () => {
          cursor.style.width = '12px'; cursor.style.height = '12px';
          cursorOutline.style.width = '40px'; cursorOutline.style.height = '40px';
          cursorOutline.style.borderColor = 'rgba(212, 175, 55, 0.4)';
        });
      });
    }

    (function () {
      /* ================= ЛОГИКА ЗАГРУЗКИ ДАННЫХ ================= */
      const PROXIES = [
        'https://api.allorigins.win/raw?url=',
        'https://api.codetabs.com/v1/proxy?quest='
      ];
      const REFRESH_COOLDOWN_MS = 3000;
      const DONE_TEXT_MS = 1500;

      function parseCSV(text) {
        const rows = []; let row = []; let field = ''; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const char = text[i]; const next = text[i + 1];
          if (inQuotes) {
            if (char === '"' && next === '"') { field += '"'; i++; }
            else if (char === '"') { inQuotes = false; }
            else { field += char; }
          } else {
            if (char === '"') { inQuotes = true; }
            else if (char === ',') { row.push(field); field = ''; }
            else if (char === '\n' || char === '\r') {
              if (char === '\r' && next === '\n') i++;
              row.push(field);
              if (row.some(cell => cell.trim() !== '')) rows.push(row);
              row = []; field = '';
            } else { field += char; }
          }
        }
        if (field !== '' || row.length > 0) {
          row.push(field);
          if (row.some(cell => cell.trim() !== '')) rows.push(row);
        }
        return rows;
      }

      function isActive(cell) {
        const normalized = String(cell).trim().toLowerCase();
        return normalized === 'true' || normalized === '1' || normalized === 'да' || normalized === 'on';
      }

      async function fetchWithProxy(url) {
        try {
          const directRes = await fetch(url, { cache: 'no-store' });
          if (directRes.ok) return await directRes.text();
        } catch (e) { /* CORS */ }
        let lastError = null;
        for (const proxy of PROXIES) {
          try {
            const response = await fetch(proxy + encodeURIComponent(url), { cache: 'no-store' });
            if (response.ok) {
              const text = await response.text();
              if (text.trim().toLowerCase().startsWith('<!doctype html') || text.trim().toLowerCase().startsWith('<html')) {
                throw new Error('Proxy error');
              }
              return text;
            }
            lastError = new Error(`HTTP ${response.status}`);
          } catch (e) { lastError = e; }
        }
        throw lastError || new Error('Load failed');
      }

      function setupButton(btn) {
        const label = btn.querySelector('.refresh-label');
        let timer = null;
        return {
          loading: () => { btn.classList.add('is-loading'); btn.disabled = true; label.textContent = '...'; },
          finish: (ok) => {
            btn.classList.remove('is-loading'); label.textContent = ok ? 'OK' : 'Err';
            setTimeout(() => { btn.disabled = false; label.textContent = 'Обновить'; }, 2000);
          }
        };
      }

      /* 1. РАЗДЕЛЫ */
      const SECTIONS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZ8ScGrpg72Ujy286RowU9xbEi8kE-BJ7jKaGAbpRBQ1JDWGzDSoOY2oC717pRF-a6vlivxqdvTvmk/pub?gid=0&single=true&output=csv';
      const sGrid = document.getElementById('sections-grid');
      const sBtn = document.getElementById('refresh-sections-btn');
      const sControl = setupButton(sBtn);

      const SVG_ARROW = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

      async function loadSections(init) {
        if (init) sControl.loading(); else sGrid.innerHTML = '<p class="sections-status">Загрузка…</p>';
        let ok = false;
        try {
          const res = await fetchWithProxy(SECTIONS_URL + '&_=' + Date.now());
          const rows = parseCSV(res);
          const h = rows[0].map(c => c.trim().toLowerCase().replace(/\s+/g, ''));
          const idx = { o: h.indexOf('порядок'), d: h.indexOf('дата'), t: h.indexOf('заголовок'), x: h.indexOf('текст'), l: h.indexOf('ссылка'), a: h.indexOf('активность') };
          
          if (Object.values(idx).includes(-1)) throw new Error('Columns missing');

          const items = rows.slice(1).map(r => ({
            o: parseInt(r[idx.o], 10), d: r[idx.d]?.trim() || '', t: r[idx.t]?.trim() || '', 
            x: r[idx.x]?.trim() || '', l: r[idx.l]?.trim() || '', a: isActive(r[idx.a])
          })).filter(i => i.a && i.t && !isNaN(i.o)).sort((a,b) => a.o - b.o);

          sGrid.innerHTML = '';
          items.forEach(item => {
            const el = document.createElement(item.l ? 'a' : 'div');
            el.className = 'section-card';
            if (item.l) { el.href = item.l; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
            
            el.innerHTML = `
              <div class="card-top">
                <span class="card-date">${item.d}</span>
                <div class="card-icon">${item.l ? SVG_ARROW : '·'}</div>
              </div>
              <div class="card-content">
                <h3 class="card-title">${item.t}</h3>
                <p class="card-text">${item.x}</p>
              </div>
            `;
            sGrid.appendChild(el);
          });
          ok = true;
        } catch (e) {
          sGrid.innerHTML = `<p class="sections-status">Ошибка: ${e.message}</p>`;
        }
        if (init) sControl.finish(ok);
      }
      sBtn.addEventListener('click', () => loadSections(true));
      loadSections(false);

      /* 2. ГАЛЕРЕЯ */
      const GALLERY_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmxQh-ENRcryK8b-QygpiSDkqGxWZizs5GVB6J2wmB15Q5fBNZfUm1BU1fnPcKemugZ2arT3hx9Dqn/pub?gid=0&single=true&output=csv';
      const gGrid = document.getElementById('gallery-grid');
      const gBtn = document.getElementById('refresh-gallery-btn');
      const gControl = setupButton(gBtn);

      async function loadGallery(init) {
        if (init) gControl.loading(); else gGrid.innerHTML = '<p class="sections-status">Загрузка…</p>';
        let ok = false;
        try {
          const res = await fetchWithProxy(GALLERY_URL + '&_=' + Date.now());
          const rows = parseCSV(res);
          const h = rows[0].map(c => c.trim().toLowerCase().replace(/\s+/g, ''));
          const idx = { o: h.indexOf('порядок'), t: h.indexOf('заголовок'), x: h.indexOf('текст'), i: h.indexOf('ссылкакартинка'), l: h.indexOf('ссылка'), a: h.indexOf('активность') };
          
          if (idx.o === -1 || idx.i === -1 || idx.a === -1) throw new Error('Columns missing');

          const items = rows.slice(1).map(r => ({
            o: parseInt(r[idx.o], 10), t: r[idx.t]?.trim() || '', x: r[idx.x]?.trim() || '', 
            i: r[idx.i]?.trim() || '', l: r[idx.l]?.trim() || '', a: isActive(r[idx.a])
          })).filter(i => i.a && i.i && !isNaN(i.o)).sort((a,b) => a.o - b.o);

          gGrid.innerHTML = '';
          items.forEach(item => {
            const el = document.createElement(item.l ? 'a' : 'div');
            el.className = 'gallery-card';
            if (item.l) { el.href = item.l; el.target = '_blank'; el.rel = 'noopener noreferrer'; }

            el.innerHTML = `
              <div class="gallery-img-wrapper">
                <img class="gallery-img" src="${item.i}" alt="${item.t}" loading="lazy">
              </div>
              <div class="gallery-overlay">
                <h3 class="gallery-title">${item.t}</h3>
                <p class="gallery-text">${item.x}</p>
                ${item.l ? `<div class="gallery-arrow">${SVG_ARROW}</div>` : ''}
              </div>
            `;
            gGrid.appendChild(el);
          });
          ok = true;
        } catch (e) {
          gGrid.innerHTML = `<p class="sections-status">Ошибка: ${e.message}</p>`;
        }
        if (init) gControl.finish(ok);
      }
      gBtn.addEventListener('click', () => loadGallery(true));
      loadGallery(false);
    })();
  </script>
</body>
</html>
