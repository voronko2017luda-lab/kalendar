<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Православный рождественский календарь: 24 дня от 14 декабря до сочельника.">
  <title>Рождественский календарь — от поста до Крещения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ... здесь весь ваш CSS без изменений ... */
    :root {
      --bg-deep: #0a1628;
      --bg-mid: #122040;
      --bg-card: #182a4a;
      --gold: #c9a227;
      --gold-light: #e3c567;
      --gold-bright: #f5e6a8;
      --gold-dim: #9c7e1e;
      --text-light: #f0e6d2;
      --text-muted: #c4b89a;
      --border-subtle: rgba(201, 162, 39, 0.18);
      --border-strong: rgba(201, 162, 39, 0.45);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'PT Serif', Georgia, serif;
      --radius: 3px;
    }
    /* ... и так далее ... */
  </style>
</head>
<body>
  <!-- ... вся HTML-разметка без изменений ... -->

  <script>
    (function () {
      // ... навигация ...
      const navToggle = document.querySelector('.nav-toggle');
      const siteNav = document.querySelector('.site-nav');
      navToggle.addEventListener('click', function () {
        const isOpen = siteNav.classList.toggle('is-open');
        navToggle.setAttribute('aria-expanded', String(isOpen));
      });
      siteNav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          siteNav.classList.remove('is-open');
          navToggle.setAttribute('aria-expanded', 'false');
        });
      });

      // 👇 ИСПРАВЛЕННЫЙ БЛОК ЗАГРУЗКИ ДАННЫХ 👇
      
      // 1. Берем ID таблицы из вашей ссылки
      const SHEET_ID = '2PACX-1vTZ8ScGrpg72Ujy286RowU9xbEi8kE-BJ7jKaGAbpRBQ1JDWGzDSoOY2oC717pRF-a6vlivxqdvTvmk';
      
      // 2. Используем эндпоинт gviz/tq, который поддерживает CORS
      const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

      // 3. Надежные прокси (corsproxy.io + резервный allorigins)
      const PROXIES = [
        'https://corsproxy.io/?url=',
        'https://api.allorigins.win/raw?url='
      ];

      const REFRESH_COOLDOWN_MS = 4000;
      const DONE_TEXT_MS = 1500;

      const grid = document.getElementById('sections-grid');
      const refreshBtn = document.getElementById('refresh-btn');
      const refreshLabel = refreshBtn.querySelector('.refresh-label');

      let cooldownTimer = null;
      let doneTextTimer = null;

      function setButtonState(state) {
        if (state === 'loading') {
          refreshBtn.classList.add('is-loading');
          refreshBtn.disabled = true;
          refreshBtn.setAttribute('aria-busy', 'true');
          refreshLabel.textContent = 'Загрузка…';
        } else if (state === 'done') {
          refreshBtn.classList.remove('is-loading');
          refreshBtn.disabled = true;
          refreshBtn.setAttribute('aria-busy', 'false');
          refreshLabel.textContent = 'Обновлено';
        } else if (state === 'error') {
          refreshBtn.classList.remove('is-loading');
          refreshBtn.disabled = true;
          refreshBtn.setAttribute('aria-busy', 'false');
          refreshLabel.textContent = 'Ошибка';
        } else {
          refreshBtn.classList.remove('is-loading');
          refreshBtn.disabled = false;
          refreshBtn.setAttribute('aria-busy', 'false');
          refreshLabel.textContent = 'Обновить';
        }
      }

      function clearTimers() {
        if (cooldownTimer) { clearTimeout(cooldownTimer); cooldownTimer = null; }
        if (doneTextTimer) { clearTimeout(doneTextTimer); doneTextTimer = null; }
      }

      function startCooldown(succeeded) {
        clearTimers();
        setButtonState(succeeded ? 'done' : 'error');
        if (succeeded) {
          doneTextTimer = setTimeout(function () { refreshLabel.textContent = 'Обновить'; }, DONE_TEXT_MS);
        }
        cooldownTimer = setTimeout(function () { setButtonState('idle'); }, REFRESH_COOLDOWN_MS);
      }

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];
          if (inQuotes) {
            if (char === '"' && next === '"') { field += '"'; i++; }
            else if (char === '"') { inQuotes = false; }
            else { field += char; }
          } else {
            if (char === '"') { inQuotes = true; }
            else if (char === ',') { row.push(field); field = ''; }
            else if (char === '\n' || char === '\r') {
              if (char === '\r' && next === '\n') i++;
              row.push(field);
              if (row.some(cell => cell.trim() !== '')) rows.push(row);
              row = []; field = '';
            } else { field += char; }
          }
        }
        if (field !== '' || row.length > 0) {
          row.push(field);
          if (row.some(cell => cell.trim() !== '')) rows.push(row);
        }
        return rows;
      }

      function isActive(cell) {
        const normalized = String(cell).trim().toLowerCase();
        return normalized === 'true' || normalized === '1' || normalized === 'да' || normalized === 'on';
      }

      function renderSections(items) {
        grid.innerHTML = '';
        if (!items.length) {
          grid.innerHTML = '<p class="sections-status">Разделы пока не добавлены.</p>';
          return;
        }
        const fragment = document.createDocumentFragment();
        items.forEach(function (item) {
          const card = document.createElement(item.link ? 'a' : 'div');
          card.className = 'section-card';
          if (item.link) card.href = item.link;
          const orderEl = document.createElement('span');
          orderEl.className = 'card-order';
          orderEl.textContent = String(item.order).padStart(2, '0');
          const titleEl = document.createElement('span');
          titleEl.className = 'card-title';
          titleEl.textContent = item.title;
          const textEl = document.createElement('span');
          textEl.className = 'card-text';
          textEl.textContent = item.text;
          const arrowEl = document.createElement('span');
          arrowEl.className = 'card-arrow';
          arrowEl.setAttribute('aria-hidden', 'true');
          arrowEl.textContent = '→';
          card.appendChild(orderEl);
          card.appendChild(titleEl);
          card.appendChild(textEl);
          card.appendChild(arrowEl);
          if (!item.link) {
            arrowEl.style.display = 'none';
            card.style.cursor = 'default';
          }
          fragment.appendChild(card);
        });
        grid.appendChild(fragment);
      }

      async function fetchWithProxy(url) {
        let lastError = null;
        for (const proxy of PROXIES) {
          try {
            const response = await fetch(proxy + encodeURIComponent(url), { cache: 'no-store' });
            if (response.ok) return await response.text();
            lastError = new Error(`Прокси ${proxy} вернул HTTP ${response.status}`);
          } catch (e) {
            lastError = e;
          }
        }
        throw lastError || new Error('Все прокси недоступны');
      }

      async function loadSections(userInitiated) {
        setButtonState('loading');
        grid.innerHTML = '<p class="sections-status">Загрузка разделов…</p>';
        let succeeded = false;
        try {
          const cacheBuster = (SHEET_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
          const csvText = await fetchWithProxy(SHEET_CSV_URL + cacheBuster);
          const rows = parseCSV(csvText);
          if (rows.length < 2) throw new Error('В таблице нет данных (менее двух строк).');
          
          const header = rows[0].map(cell => cell.trim().toLowerCase());
          const orderIdx = header.indexOf('порядок');
          const titleIdx = header.indexOf('заголовок');
          const textIdx = header.indexOf('текст');
          const linkIdx = header.indexOf('ссылка');
          const activeIdx = header.indexOf('активность');

          if (orderIdx === -1 || titleIdx === -1 || textIdx === -1 || activeIdx === -1) {
            throw new Error('Не найдены нужные столбцы. Проверьте заголовки.');
          }

          const items = rows.slice(1)
            .map(function (row) {
              return {
                order: parseInt(row[orderIdx], 10),
                title: row[titleIdx] ? row[titleIdx].trim() : '',
                text: row[textIdx] ? row[textIdx].trim() : '',
                link: linkIdx !== -1 && row[linkIdx] ? row[linkIdx].trim() : '',
                active: isActive(row[activeIdx])
              };
            })
            .filter(item => item.active && item.title && !isNaN(item.order))
            .sort((a, b) => a.order - b.order);

          renderSections(items);
          succeeded = true;
        } catch (error) {
          console.error('Не удалось загрузить разделы:', error);
          grid.innerHTML = `<p class="sections-status is-error">Не удалось загрузить разделы. ${error.message}. Проверьте подключение и нажмите «Обновить».</p>`;
        }
        if (userInitiated) {
          startCooldown(succeeded);
        } else {
          setButtonState('idle');
        }
      }

      refreshBtn.addEventListener('click', function () {
        loadSections(true);
      });

      loadSections(false);
      // 👆 КОНЕЦ ИСПРАВЛЕННОГО БЛОКА 👆
    })();
  </script>

</body>
</html>
